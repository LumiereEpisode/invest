/* ---------- 技术面分析引擎 ---------- */
const TA_CACHE = {};
function sma(arr, n) {
  const out = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= n) sum -= arr[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}
function rsi(arr, n) {
  const out = new Array(arr.length).fill(null);
  let g = 0, l = 0;
  for (let i = 1; i < arr.length; i++) {
    const d = arr[i] - arr[i - 1];
    const up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); } }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); }
  }
  return out;
}
function macd(arr) {
  const e12 = ema(arr, 12), e26 = ema(arr, 26);
  const dif = arr.map((_, i) => (e12[i] != null && e26[i] != null) ? e12[i] - e26[i] : null);
  const difV = dif.map(x => x == null ? 0 : x);
  const deaRaw = ema(difV, 9);
  return { dif, dea: deaRaw.map((x, i) => dif[i] == null ? null : x) };
}
function ema(arr, n) {
  const k = 2 / (n + 1);
  const out = new Array(arr.length).fill(null);
  let prev = null;
  for (let i = 0; i < arr.length; i++) {
    prev = prev === null ? arr[i] : arr[i] * k + prev * (1 - k);
    if (i >= n - 1) out[i] = prev;
  }
  return out;
}
function kdj(bars) {
  const K = [], D = [], J = [];
  let pk = 50, pd = 50;
  for (let i = 0; i < bars.length; i++) {
    const lo = Math.min(...bars.slice(Math.max(0, i - 8), i + 1).map(b => b.low));
    const hi = Math.max(...bars.slice(Math.max(0, i - 8), i + 1).map(b => b.high));
    const rsv = hi > lo ? (bars[i].close - lo) / (hi - lo) * 100 : 50;
    pk = 2 / 3 * pk + 1 / 3 * rsv;
    pd = 2 / 3 * pd + 1 / 3 * pk;
    K.push(pk); D.push(pd); J.push(3 * pk - 2 * pd);
  }
  return { K, D, J };
}
function computeTA(key, secid, bars, curPrice) {
  const closes = bars.map(b => b.close);
  const last = closes.length - 1;
  const price = curPrice != null ? curPrice : closes[last];
  if (bars.length < 30) return null;
  const ma5 = sma(closes, 5), ma10 = sma(closes, 10), ma20 = sma(closes, 20), ma60 = sma(closes, 60);
  const { dif, dea } = macd(closes);
  const kd = kdj(bars);
  const low20 = Math.min(...bars.slice(-20).map(b => b.low));
  const high20 = Math.max(...bars.slice(-20).map(b => b.high));
  const high60 = Math.max(...bars.slice(-60).map(b => b.high));
  // 布林带（20日，2σ）
  const win = closes.slice(-20);
  const mean = ma20[last];
  const std = Math.sqrt(win.reduce((s, x) => s + (x - mean) * (x - mean), 0) / win.length);
  const bollUp = mean + 2 * std, bollLow = mean - 2 * std;
  // MACD 金叉/死叉（近3根K线内）
  let macdCross = 0;
  for (let i = last; i > last - 3 && i > 0; i--) {
    if (dif[i] != null && dif[i - 1] != null && dif[i] > dea[i] && dif[i - 1] <= dea[i - 1]) { macdCross = 1; break; }
    if (dif[i] != null && dif[i - 1] != null && dif[i] < dea[i] && dif[i - 1] >= dea[i - 1]) { macdCross = -1; break; }
  }
  const kdjCross = kd.K[last] > kd.D[last] && kd.K[last - 1] <= kd.D[last - 1];
  const kdjDead = kd.K[last] < kd.D[last] && kd.K[last - 1] >= kd.D[last - 1];
  const vols = bars.map(b => b.volume);
  const v5 = sma(vols, 5)[last];
  const volRatio = v5 > 0 ? vols[last] / v5 : 1;
  const nearSupport = price <= low20 * 1.03;
  // 评分（MACD/KDJ/BOLL 三指标共振 + 量能 + 支撑，对齐券商投研多因子框架）
  let score = 0; const why = []; const chips = [];
  if (macdCross === 1) { score += 2; why.push("MACD 刚刚金叉，动能转多"); chips.push({ text: "MACD金叉", cls: "good" }); }
  else if (macdCross === -1) { score -= 1; chips.push({ text: "MACD死叉", cls: "bad" }); }
  else if (dif[last] > dea[last]) { score += 0.5; chips.push({ text: "MACD多头", cls: "good" }); }
  else chips.push({ text: "MACD空头", cls: "bad" });
  if (kdjCross && kd.J[last] < 40) { score += 1.5; why.push("KDJ 低位金叉（J=" + kd.J[last].toFixed(1) + "）"); chips.push({ text: "KDJ金叉", cls: "good" }); }
  else if (kdjDead && kd.J[last] > 80) { score -= 1.5; why.push("KDJ 高位死叉（J=" + kd.J[last].toFixed(1) + "），短线过热"); chips.push({ text: "KDJ高位死叉", cls: "bad" }); }
  else chips.push({ text: "KDJ " + (kd.K[last] > kd.D[last] ? "多头" : "空头"), cls: kd.K[last] > kd.D[last] ? "good" : "bad" });
  if (price <= bollLow * 1.02) { score += 1.5; why.push("现价触及布林下轨 " + bollLow.toFixed(2) + "，超跌回归概率大"); chips.push({ text: "BOLL下轨", cls: "good" }); }
  else if (price > bollUp) { score -= 0.5; why.push("现价突破布林上轨 " + bollUp.toFixed(2) + "，短线乖离偏大"); chips.push({ text: "BOLL上轨外", cls: "bad" }); }
  else if (price >= mean && closes[last - 1] < mean) { score += 1; why.push("K线自下而上突破布林中轨 " + mean.toFixed(2)); chips.push({ text: "BOLL中轨上", cls: "good" }); }
  else chips.push({ text: "BOLL中轨", cls: "" });
  if (price < ma20[last] * 0.95) { score += 1; why.push("现价较20日均线偏离 " + ((price / ma20[last] - 1) * 100).toFixed(1) + "%，超跌明显"); }
  if (nearSupport) { score += 1; why.push("现价贴近20日低点支撑 " + low20.toFixed(2)); }
  if (price > ma5[last] && price > ma10[last] && price > ma20[last]) chips.push({ text: "均线多头", cls: "good" });
  else if (price < ma5[last] && price < ma10[last] && price < ma20[last]) chips.push({ text: "均线空头", cls: "bad" });
  if (volRatio > 1.5 && bars[last].close > bars[last].open) { score += 1; why.push("放量阳线（量比 " + volRatio.toFixed(1) + "），资金介入迹象"); chips.push({ text: "放量", cls: "hot" }); }
  else if (volRatio < 0.7) chips.push({ text: "缩量", cls: "" });
  // 热度：量比/换手/涨幅加权（0-100）
  const q = LIVEQ[secid];
  const tor = q && isFinite(q.tor) ? q.tor : 0;
  const vrb = q && isFinite(q.vr) ? q.vr : volRatio;
  const pctv = q && isFinite(q.pct) ? q.pct : (bars[last].close / bars[last - 1].close - 1) * 100;

function loadScriptVar(url, varName) {

    s.src = url + "&_t=" + Date.now();
    s.onload = () => { s.remove(); resolve(window[varName]); };
    s.onerror = () => { s.remove(); reject(new Error("load fail")); };
    document.body.appendChild(s);

async function fetchKline(secid) {

  else if (mk === "0") tcode = "sz" + code;
  else if (mk === "116") tcode = "hk" + ("00000" + code).slice(-5);
  if (!tcode) return null;
  const vn = "tkl_" + code.replace(/[^\w]/g, "") + "_" + (Date.now() % 100000000);
  // 主源走 proxy.finance.qq.com（web.ifzq.gtimg.cn 已被腾讯 WAF 拦截，返回501）
  let d = await loadScriptVar("https://proxy.finance.qq.com/ifzqgtimg/appstock/app/fqkline/get?param=" + tcode + ",day,,,150,qfq&_var=" + vn, vn);
  if (!d) d = await loadScriptVar("https://ifzq.gtimg.cn/appstock/app/fqkline/get?param=" + tcode + ",day,,,150,qfq&_var=" + vn, vn);
  const node = d && d.data && d.data[tcode];

function drawSpark(key) {
  const c = document.getElementById("spark-" + key);
  if (!c) return;
  try {
    const pts = (c.getAttribute("data-points") || "").split(",").map(Number).filter(n => isFinite(n));
    if (pts.length < 2) return;
    const rect = c.getBoundingClientRect();
    const w = Math.round(rect.width) || 320, h = Math.round(rect.height) || 46;
    if (w < 20 || h < 10) return;                       // 不可见时跳过，等布局完成再画
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    const ctx = c.getContext("2d");
    if (!ctx) return;

    const min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1;
    const up = pts[pts.length - 1] >= pts[0];
    const col = up ? "#e03131" : "#0ca678";
    const px = i => 3 + i / (pts.length - 1) * (w - 6);
    const py = p => h - 5 - (p - min) / span * (h - 11);
    ctx.beginPath();
    pts.forEach((p, i) => { const x = px(i), y = py(p); if (isFinite(x) && isFinite(y)) i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke();
    ctx.lineTo(px(pts.length - 1), h - 1); ctx.lineTo(px(0), h - 1); ctx.closePath();
    ctx.fillStyle = up ? "rgba(224,49,49,.09)" : "rgba(12,166,120,.09)"; ctx.fill();

function drawKline(key) {
  const c = document.getElementById("kline-" + key);
  const ta = TA_CACHE[key];
  if (!c || !ta || !Array.isArray(ta.bars) || ta.bars.length < 5) return;
  try {
    const rect = c.getBoundingClientRect();
    const w = Math.round(rect.width) || 320, h = Math.round(rect.height) || 170;
    if (w < 40 || h < 60) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    const ctx = c.getContext("2d");
    if (!ctx) return;

    const n = bars.length;
    const closes = ta.closes;
    const lows = Math.min(...bars.map(b => b[2])), highs = Math.max(...bars.map(b => b[3]));
    const span = (highs - lows) || 1;
    const priceH = Math.round(h * 0.72), volTop = priceH + 8, volH = h - volTop - 6;
    const maxVol = Math.max(...bars.map(b => b[4])) || 1;
    const cw = (w - 8) / n;                        // 每根蜡烛宽度
    const py = p => 6 + (highs - p) / span * (priceH - 10);
    const bw = Math.max(1.5, Math.min(cw * 0.62, 9));

        const idx = closes.length - n + i;

    ctx.fillText(lastC.toFixed(2), 4, py(lastC) - 3);
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--sub") || "#7a8299";
    ctx.font = "9px -apple-system, sans-serif";
    ctx.fillText("MA5", w - 92, 12); ctx.fillText("MA10", w - 62, 12); ctx.fillText("MA20", w - 32, 12);

}

  set.forEach(secid => {

    else if (EM_ONLY.includes(secid)) emList.push(secid);
    else { const tk = tencentKey(secid); if (tk) tCodes.push([tk, secid]); }
  });
}
let _emTick = 0, _failTencent = 0, _failEM = 0;
function pollTencent() {
  if (!tCodes.length) return;
  const s = document.createElement("script");
  s.charset = "gbk";
  s.src = "https://qt.gtimg.cn/q=" + tCodes.map(c => c[0]).join(",") + "&_t=" + Date.now();
  let ok = false;
  s.onload = () => { ok = true; s.remove(); };
  s.onerror = () => { s.remove(); };
  document.body.appendChild(s);
  setTimeout(() => {
    let got = 0;
    tCodes.forEach(([tk, secid]) => {
      const raw = window["v_" + tk];
      if (!raw) return;
      const f = raw.split("~");
      if (f.length < 6) return;
      const price = parseFloat(f[3]), pre = parseFloat(f[4]);
      if (!isFinite(price) || price <= 0) return;
      const pct = (isFinite(pre) && pre > 0) ? (price / pre - 1) * 100 : parseFloat(f[32]);
      const tor = parseFloat(f[38]), vr = parseFloat(f[49]);   // 换手率 / 量比（热度计算用）
      LIVEQ[secid] = { price, pct: isFinite(pct) ? pct : 0, pre: isFinite(pre) ? pre : 0,
        tor: isFinite(tor) ? tor : 0, vr: isFinite(vr) ? vr : 0 };
      got++;
    });
    if (got) { _failTencent = 0; livePatch(); setDot("on"); }
    else if (++_failTencent > 4) setDot("off");

function statusBadge(low, high, stop, cur) {
  if (cur >= low && cur <= high) return '<span class="badge hit">● 买点已触发</span>';

/* ---------- 账户动态聚合：股数×实时价 ---------- */
function holdingsAgg() {
  let mv = 0, cost = 0, dayPnl = 0;
  allHoldings().forEach(h => {
    const secid = stockSecid(h.code);
    const q = secid && LIVEQ[secid];
    const eff = effHold(h);
    const p = (q && typeof q.price === "number" && q.price > 0) ? q.price : h.current;
    if (!p || !eff.shares) return;
    mv += p * eff.shares;
    if (eff.cost) cost += eff.cost * eff.shares;
    if (q && q.pre > 0) dayPnl += (q.price - q.pre) * eff.shares;
  });
  return { mv: mv, cost: cost, dayPnl: dayPnl };
}
function patchAccount() {
  const a = DATA.account || {};
  const g = holdingsAgg();
  if (!g.mv) return;
  const assets = g.mv + (a.cash || 0);
  const posPnl = g.mv - g.cost;
  const mvEl = document.getElementById("acct-mv");
  if (mvEl) mvEl.textContent = money(g.mv);
  const asEl = document.getElementById("acct-assets");
  if (asEl) asEl.textContent = money(assets);
  const pp = document.getElementById("acct-pospnl");
  if (pp) { pp.textContent = sign(posPnl.toFixed(2)); pp.className = cls(posPnl); }
  const dp = document.getElementById("acct-daypnl");
  if (dp && g.dayPnl) {
    const base = g.mv - g.dayPnl;
    const pct = base > 0 ? g.dayPnl / base * 100 : 0;
    dp.innerHTML = sign(g.dayPnl.toFixed(2)) + ' (' + sign(pct.toFixed(2)) + '%)';
    dp.className = cls(g.dayPnl);
  }
  document.querySelectorAll('[data-live^="hmv:"]').forEach(el => {
    const q = LIVEQ[el.dataset.live.slice(4)];
    const sh = parseFloat(el.dataset.shares);
    if (q && typeof q.price === "number" && sh > 0) el.textContent = money(q.price * sh);
  });
  document.querySelectorAll('[data-live^="hpct:"]').forEach(el => {
    const q = LIVEQ[el.dataset.live.slice(5)];
    const sh = parseFloat(el.dataset.shares);
    if (q && typeof q.price === "number" && sh > 0 && assets > 0) el.textContent = (q.price * sh / assets * 100).toFixed(1) + "%";
  });
}
function livePatch() {
  document.querySelectorAll("[data-live]").forEach(el => {
    const parts = el.dataset.live.split(":");
    const kind = parts[0], sec = parts[1];
    const q = LIVEQ[sec];
    if (!q || typeof q.price !== "number" || !isFinite(q.price)) return;
    if (kind === "price" || kind === "value" || kind === "hprice") {
      el.textContent = q.price;
      if (kind === "hprice") {
        const cost = parseFloat(el.dataset.cost);
        el.className = "now " + (cost > 0 ? cls(q.price - cost) : cls(q.pct));
      } else if (kind === "value") {
        el.classList.remove("up", "down", "flat"); el.classList.add(cls(q.pct));
      }
    } else if (kind === "pct") {
      el.textContent = (q.pct > 0 ? "+" : "") + q.pct.toFixed(2) + "%";
      el.classList.remove("up", "down", "flat"); el.classList.add(cls(q.pct));
    } else if (kind === "hpnl") {
      const cost = parseFloat(el.dataset.cost), sh = parseFloat(el.dataset.shares);
      if (cost > 0 && sh > 0) {
        const pnl = (q.price - cost) * sh, p = (q.price - cost) / cost * 100;
        el.innerHTML = sign(pnl.toFixed(2)) + '<small> (' + sign(p.toFixed(2)) + '%)</small>';
        el.classList.remove("up", "down", "flat"); el.classList.add(cls(p));
      }
    } else if (kind === "daypnl") {
      patchAccount();
    } else if (kind === "status") {
      const low = parseFloat(el.dataset.low), high = parseFloat(el.dataset.high);
      const stop = el.dataset.stop && el.dataset.stop !== "null" ? parseFloat(el.dataset.stop) : null;
      el.innerHTML = statusBadge(low, high, stop, q.price);
    }
  });
  patchAccount();
}
